name: SX ANLYS APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - shell: bash
        run: ./gradlew --console=plain assembleFossDebug -x lint 2>&1 | tee build.log
        env:
          SXANALYS_APP_NAME: SX ANLYS
          SXANALYS_APPLICATION_ID: com.sx.anlys
          SXANALYS_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.github/sx-debug.jks
      - if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong|FAILED" -A4 build.log | head -60 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Siapkan sx_anlys.apk
        run: |
          APK=$(ls app/build/outputs/apk/foss/debug/*.apk | head -n 1)
          mkdir -p out
          cp "$APK" out/sx_anlys.apk
      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          EXISTING=$(gh release list --limit 300 --json tagName,name --jq ".[] | select(.name | startswith(\"SX ANLYS ${VERSION} \")) | .tagName" | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh release upload "$EXISTING" out/sx_anlys.apk --clobber
          else
            N=$(gh release list --limit 300 --json name --jq '[.[] | select(.name | test("#[0-9]+$"))] | length')
            N=$((N + 1))
            while gh release view "sx-$N" >/dev/null 2>&1; do N=$((N + 1)); done
            gh release create "sx-$N" out/sx_anlys.apk --title "SX ANLYS ${VERSION} #${N}" --notes "Versi ${VERSION}" --target "${{ github.sha }}"
          fi
