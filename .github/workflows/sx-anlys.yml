name: SX ANLYS APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - shell: bash
        run: ./gradlew --console=plain assembleFossDebug -x lint 2>&1 | tee build.log
        env:
          METROLIST_APP_NAME: SX ANLYS
          METROLIST_APPLICATION_ID: com.sx.anlys
          METROLIST_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.github/sx-debug.jks
          SX_BUILD_NUMBER: ${{ github.run_number }}
          SX_GOOGLE_WEB_CLIENT_ID: ${{ vars.SX_GOOGLE_WEB_CLIENT_ID }}
      - if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong|FAILED" -A4 build.log | head -60 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/foss/debug/*.apk | head -n 1)
          mkdir -p out
          cp "$APK" out/SX-ANLYS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SX-ANLYS-apk
          path: out/SX-ANLYS.apk
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" out/SX-ANLYS.apk --title "SX ANLYS $TAG" --notes "Build otomatis #${{ github.run_number }}" --target "${{ github.sha }}"
