name: SX ANLYS APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - shell: bash
        run: ./gradlew --console=plain assembleFossDebug -x lint 2>&1 | tee build.log
        env:
          SXANALYS_APP_NAME: SX ANLYS
          SXANALYS_APPLICATION_ID: com.sx.anlys
          SXANALYS_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.github/sx-debug.jks
      - if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong|FAILED" -A4 build.log | head -60 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Siapkan sx_anlys.apk
        run: |
          find app/build/outputs -name '*.apk' -print
          APK=$(find app/build/outputs/apk/foss/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan di app/build/outputs/apk/foss/debug"
            exit 1
          fi
          mkdir -p out
          cp "$APK" out/sx_anlys.apk
          ls -la out
      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f VERSION ]; then VERSION=$(tr -d '[:space:]' < VERSION); else VERSION="1.0.0.0.0"; fi
          EXISTING=$(gh release list --limit 300 --json tagName,name --jq ".[] | select(.name | startswith(\"SX ANLYS ${VERSION} \")) | .tagName" | head -n 1)
          if [ -n "$EXISTING" ]; then
            TAG="$EXISTING"
            gh release upload "$TAG" out/sx_anlys.apk --clobber
          else
            N=$(gh release list --limit 300 --json name --jq '[.[] | select(.name | test("#[0-9]+$"))] | length')
            N=$((N + 1))
            while gh release view "sx-$N" >/dev/null 2>&1; do N=$((N + 1)); done
            TAG="sx-$N"
            gh release create "$TAG" out/sx_anlys.apk --title "SX ANLYS ${VERSION} #${N}" --notes "Versi ${VERSION}" --target "${{ github.sha }}"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
          {
            echo "### APK siap diunduh"
            echo "Versi ${VERSION}, rilis ${TAG}"
            echo ""
            echo "[Unduh sx_anlys.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/sx_anlys.apk)"
            echo ""
            echo "[Halaman rilis](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
